# Include once inside nginx http {}. Replace example domain/certificate/static paths before enabling.
# Never point root/alias at an ANOF instance. No real_ip trust or extra proxy hops.
map $uri $anof_cache_control {
    default "no-store";
    / "no-cache";
    /index.html "no-cache";
    ~^/assets/.*-[A-Za-z0-9_-]+\.(js|css|wasm)$ "public, max-age=31536000, immutable";
}
# Deliberately omit target, query, headers, body and remote user.
log_format anof_safe '$time_iso8601 $request_method $status $body_bytes_sent $request_time $upstream_response_time';
server {
    listen 443 ssl;
    server_name cloud.example.test;
    ssl_certificate /etc/anof/tls/fullchain.pem;
    ssl_certificate_key /etc/anof/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    if ($http_host != cloud.example.test) { return 421; }
    root /usr/local/share/anof/web;
    autoindex off;
    disable_symlinks on;
    gzip off;
    access_log /var/log/anof/nginx/access.log anof_safe;
    # nginx error messages can contain the raw request including secrets/query.
    # Retain only the safe access log and ANOF structured diagnostics by default.
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $anof_cache_control always;
    client_max_body_size 8m;
    client_body_timeout 360s;
    send_timeout 360s;
    location ~ ^/(api|health)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host cloud.example.test;
        proxy_set_header Connection close;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-ANOF-Request $http_x_anof_request;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header If-Match $http_if_match;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Upload-Offset $http_upload_offset;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        # These are idle deadlines, not total request/response lifetimes.
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }
    location = / { default_type text/html; try_files /index.html =404; }
    location = /index.html { default_type text/html; try_files $uri =404; }
    location = /THIRD_PARTY_NOTICES.txt { default_type text/plain; try_files $uri =404; }
    location /assets/ {
        types { application/javascript js; text/css css; application/wasm wasm; }
        try_files $uri =404;
    }
    location / { return 404; }
}
